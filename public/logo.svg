<svg width="200" height="40" viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
  <!-- Digital Bazar Professional Logo -->
  <!-- Concept: Modern local-commerce symbol combining shopping basket + location + digital connection -->
  <defs>
    <linearGradient id="brandGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0F766E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0D5F58;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon: Shopping basket with location pin integration -->
  <g transform="translate(0, 2)">
    <rect x="2" y="2" width="32" height="32" rx="8" fill="url(#brandGradient)"/>
    <!-- Basket -->
    <path d="M10 12 L11 24 L25 24 L26 12 Z" fill="none" stroke="white" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M10 12 L26 12" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
    <!-- Basket handle/location pin subtle -->
    <circle cx="18" cy="10" r="3" fill="none" stroke="white" stroke-width="1.2"/>
    <circle cx="18" cy="10" r="1" fill="white"/>
    <!-- Digital dots -->
    <circle cx="12" cy="18" r="1" fill="white" opacity="0.9"/>
    <circle cx="18" cy="18" r="1" fill="white" opacity="0.9"/>
    <circle cx="24" cy="18" r="1" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Text: Digital Bazar -->
  <g transform="translate(44, 0)">
    <text x="0" y="18" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="700" fill="#172033" letter-spacing="-0.02em">Digital Bazar</text>
    <text x="0" y="30" font-family="Inter, -apple-system, sans-serif" font-size="9" font-weight="500" fill="#64748B" letter-spacing="0.05em" style="text-transform: uppercase;">Select Before You Arrive</text>
  </g>
</svg>
